name: Anylinux-AppImage (Nightly)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# comment these two out to enable nightly builds, this sets DEVEL_RELEASE=1  #
# for get-dependencies.sh to make a nightly release with a 'nightly' tag     #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#  schedule:
#    - cron: "0 5 1/2 * *" # rebuild nightly every 2 days
  workflow_dispatch: {}
jobs:
  build:
    name: "Build AppImage (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@fb7ea86ffa0bf4fac3b0635b988dc934b2d9a64a # v3
      - name: Install Dependencies
        run: DEVEL_RELEASE=1 /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: DEVEL_RELEASE=1 /bin/sh ./make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  # no native runners: qemu user emulation, see .github/scripts/register-binfmt.sh
  build-emulated:
    name: "Build AppImage (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, platform: linux/riscv64 }
          - { arch: loongarch64, platform: linux/loong64 }
          - { arch: ppc64le, platform: linux/ppc64le }
          - { arch: ppc64, platform: linux/ppc64 } # powerpc64 BE, uname -m reports ppc64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Register QEMU binfmt handlers
        run: .github/scripts/register-binfmt.sh
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { repository: pkgforge-dev/anylinux-setup-action, ref: fb7ea86ffa0bf4fac3b0635b988dc934b2d9a64a, path: setup-action } # v3
      - name: Build AppImage
        env:
          PLATFORM: ${{ matrix.platform }}
          DEVEL_RELEASE: 1
        run: |
          set -eu
          # the setup action is mounted from the checkout above; sourcing keeps presets alive
          docker run --rm --platform "$PLATFORM" -e GITHUB_REPOSITORY -e DEVEL_RELEASE \
            -v "$PWD":/repo -v "$PWD/setup-action":/action \
            -w /repo ghcr.io/pkgforge-dev/archlinux:latest \
            /bin/sh -euc 'sh /action/setup.sh && . ./get-dependencies.sh && cd /repo && . ./make-appimage.sh'
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build, build-emulated]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: AppImage-*
          merge-multiple: true
        continue-on-error: true
      - name: Release Nightly AppImage
        uses: pkgforge-dev/make-nightly-appimage-release@17cbe90fc0796286e424619a54a82a3a880efe4c # v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
